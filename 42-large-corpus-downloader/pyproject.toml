[project]
name = "large-corpus-downloader"
version = "0.1.0"
description = "Streaming, resumable, deduplicating corpus downloader with a verifiable shard manifest."
requires-python = ">=3.11"
authors = [{ name = "Pedro Monteiro" }]
dependencies = ["zstandard==0.25.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "mypy==2.4.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["code/main.py", "code/local_server.py", "tests"]
mypy_path = "code"
