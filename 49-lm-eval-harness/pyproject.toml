[project]
name = "lm-eval-harness"
version = "0.1.0"
description = "A small, swappable language-model evaluation harness with JSONL tasks, five metrics, and a reproducible leaderboard."
requires-python = ">=3.11"
authors = [{ name = "Pedro Monteiro" }]
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0", "mypy==2.4.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["code/main.py", "tests"]
mypy_path = "code"
