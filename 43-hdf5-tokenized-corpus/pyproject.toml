[project]
name = "hdf5-tokenized-corpus"
version = "0.1.0"
description = "Streaming byte tokenizer, resizable chunked HDF5 shards, and a deterministic sliding-window dataloader."
requires-python = ">=3.12"
authors = [{ name = "Pedro Monteiro" }]
dependencies = ["h5py==3.16.0", "numpy==2.5.5"]

[dependency-groups]
dev = ["pytest==9.2.0", "mypy==2.4.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code", "tests"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["code/main.py", "tests"]
mypy_path = "code:tests"

[[tool.mypy.overrides]]
module = ["h5py", "h5py.*"]
ignore_missing_imports = true
