[project]
name = "instruction-tuning-sft"
version = "0.1.0"
description = "Alpaca-style supervised fine-tuning with response-only loss masking."
requires-python = ">=3.11"
authors = [{ name = "Pedro Monteiro" }]
dependencies = ["torch==2.15.0"]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "mypy==2.4.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["code/main.py", "tests"]
mypy_path = "code"
