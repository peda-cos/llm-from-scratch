[project]
name = "loading-pretrained-weights"
version = "0.1.0"
description = "Load GPT-2 safetensors checkpoints into a local model with validated name mapping and shape checks."
requires-python = ">=3.11"
authors = [{ name = "Pedro Monteiro" }]
dependencies = [
  "numpy==2.4.2",
  "torch==2.15.0",
  "safetensors==0.8.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "mypy==2.4.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["code/main.py", "tests"]
mypy_path = "code"
