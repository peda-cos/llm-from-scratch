[project]
name = "bpe-tokenizer-from-scratch"
version = "0.1.0"
description = "Byte-level BPE tokenizer trained from scratch with exact UTF-8 round-trip."
requires-python = ">=3.11"
authors = [{ name = "Pedro Monteiro" }]
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "mypy==2.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
strict = true
files = ["main.py", "tests"]
