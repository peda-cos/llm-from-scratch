[project]
name = "checkpoint-save-resume"
version = "0.1.0"
description = "Atomic full-state checkpoints with RNG restoration and hash-verified shards."
requires-python = ">=3.11"
authors = [{ name = "Pedro Monteiro" }]
dependencies = ["torch==2.15.0", "numpy==2.4.2"]

[dependency-groups]
dev = ["pytest==9.2.0", "mypy==2.4.1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code", "tests"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["code/main.py", "tests"]
mypy_path = "code:tests"
